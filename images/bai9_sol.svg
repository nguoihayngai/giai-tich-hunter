<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220" style="background:#ffffff;font-family:sans-serif">
  <!-- (a) f(x) = 1/(x+2) -->
  <g transform="translate(20,10)">
    <text x="115" y="16" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">(a) f(x) = 1/(x+2)</text>
    <!-- Axes -->
    <line x1="10" y1="105" x2="230" y2="105" stroke="#334155" stroke-width="1.5"/>
    <line x1="150" y1="20" x2="150" y2="195" stroke="#334155" stroke-width="1.5"/>
    <!-- Asymptote x = -2 -->
    <line x1="90" y1="22" x2="90" y2="195" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="74" y="122" font-size="12" fill="#ef4444" font-weight="bold">-2</text>
    <text x="155" y="120" font-size="11" fill="#334155">0</text>
    <!-- Hyperbola left branch -->
    <path d="M 15 115 Q 72 120 84 190" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <!-- Hyperbola right branch -->
    <path d="M 96 25 Q 108 95 220 100" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <!-- (b) f(x) = 1/(x+2) with f(-2)=1 -->
  <g transform="translate(295,10)">
    <text x="120" y="16" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">(b) Kèm điểm f(-2) = 1</text>
    <!-- Axes -->
    <line x1="10" y1="105" x2="230" y2="105" stroke="#334155" stroke-width="1.5"/>
    <line x1="150" y1="20" x2="150" y2="195" stroke="#334155" stroke-width="1.5"/>
    <!-- Asymptote x = -2 -->
    <line x1="90" y1="22" x2="90" y2="195" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="74" y="122" font-size="12" fill="#ef4444" font-weight="bold">-2</text>
    <text x="155" y="80" font-size="11" fill="#334155">1</text>
    <!-- Solid dot at (-2, 1) -->
    <circle cx="90" cy="75" r="4.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
    <text x="65" y="68" font-size="11" font-weight="bold" fill="#16a34a">(-2, 1)</text>
    <!-- Hyperbola branches -->
    <path d="M 15 115 Q 72 120 84 190" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M 96 25 Q 108 95 220 100" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  </g>
</svg>
